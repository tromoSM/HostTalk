name: Build macOS DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build app with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --onefile \
          --name HostTalk \
          --icon icon.ico \
          --add-data "static:static" \
          --add-data "templates:templates" \
          server.py

      - name: Create .app bundle
        run: |
          mkdir -p HostTalk.app/Contents/MacOS
          mkdir -p HostTalk.app/Contents/Resources
          cp dist/HostTalk HostTalk.app/Contents/MacOS/
          cp icon.ico HostTalk.app/Contents/Resources/

      - name: Create DMG
        run: |
          hdiutil create -volname "HostTalk" -srcfolder HostTalk.app -ov -format UDZO HostTalk.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HostTalk-macOS
          path: HostTalk.dmg
